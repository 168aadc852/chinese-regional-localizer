[package]
name = "chinese-regional-localizer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust reference runtime for deterministic Chinese regional localization"

[lib]
path = "src/lib_v2.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "3.0.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

name: PoC tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q scripts src tests

      - name: Lint Python for fatal errors
        run: ruff check scripts src tests --select E9,F63,F7,F82

      - name: Validate manifest
        run: PYTHONPATH=scripts python -c "from pathlib import Path; import poc_builder; poc_builder.load_manifest(Path('data-registry/sources.yaml'))"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build demo database
        run: python scripts/build_demo_database.py

      - name: Run realistic corpus evaluation
        run: python scripts/evaluate_corpus.py

      - name: Performance smoke check
        run: >-
          python scripts/benchmark_localizer.py
          --target-chars 5000
          --warmups 1
          --iterations 3
          --min-chars-per-sec 100
          --max-p95-ms 10000
          --max-peak-kib 524288

      - name: Apply Phase 3A Rust cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-3a-rust-parity'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '&& !boundary_ok(text, start, end, "x")',
              '&& !boundary_ok(text, start, end, &text[start..end])',
          )
          path.write_text(text, encoding='utf-8')
          PY
          cargo clippy --fix --manifest-path rust/Cargo.toml --all-targets --allow-dirty --allow-staged -- -D warnings
          cargo fmt --manifest-path rust/Cargo.toml

      - name: Persist Phase 3A Rust cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-3a-rust-parity'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src rust/tests rust/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(rust): finalize formatted clippy-clean parity core"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Rust format check
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust parity tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

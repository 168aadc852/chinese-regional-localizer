name: PoC tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q scripts src tests

      - name: Lint Python for fatal errors
        run: ruff check scripts src tests --select E9,F63,F7,F82

      - name: Validate manifest
        run: PYTHONPATH=scripts python -c "from pathlib import Path; import poc_builder; poc_builder.load_manifest(Path('data-registry/sources.yaml'))"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build demo database
        run: python scripts/build_demo_database.py

      - name: Run realistic corpus evaluation
        run: python scripts/evaluate_corpus.py

      - name: Performance smoke check
        run: >-
          python scripts/benchmark_localizer.py
          --target-chars 5000
          --warmups 1
          --iterations 3
          --min-chars-per-sec 100
          --max-p95-ms 10000
          --max-peak-kib 524288

      - name: Rust format check
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust parity tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

[package]
name = "chinese-regional-localizer-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal Tauri 2 desktop shell for Chinese Regional Localizer"

[lib]
name = "chinese_regional_localizer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chinese-regional-localizer = { path = "../../rust" }

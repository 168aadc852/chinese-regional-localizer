[package]
name = "chinese-regional-localizer-desktop"
version = "0.1.0"
description = "Tauri desktop shell for Chinese Regional Localizer"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "chinese_regional_localizer_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chinese-regional-localizer = { path = "../../rust" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
